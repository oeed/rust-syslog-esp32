[package]

authors = ["oeed"]
description = "RFC 5424 syslog over TCP for ESP32, with a reboot-persistent spill buffer for offline delivery"
edition = "2024"
keywords = ["syslog", "logs", "logging"]
license = "MIT"
name = "syslog_esp32"
repository = "https://github.com/oeed/rust-syslog-esp32"
version = "8.0.2"

[dependencies]
esp-idf-svc = "0.51"
log = {version = "0.4.8", features = ["std"]}
time = {version = "0.3.5", features = ["formatting"]}
